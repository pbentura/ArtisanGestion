version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: artisangestion-db
    restart: unless-stopped
    env_file:
      - .env.production
    # Pas de valeurs de repli ici : les identifiants viennent de .env.production,
    # qui n'est pas versionné.
    # Liaison sur 127.0.0.1 : la base est accessible uniquement en local
    # sur le VPS (via tunnel SSH), et reste inaccessible depuis Internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: artisangestion-backend
    restart: unless-stopped
    expose:
      - 8000
    environment:
      - POSTGRES_SERVER=db
    env_file:
      - .env.production
    depends_on:
      - db
    networks:
      - app-network
    # Run migrations and then use standard uvicorn worker for production (no --reload)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

networks:
  app-network:
    external: true

volumes:
  pgdata:
