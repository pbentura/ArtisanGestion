version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: artisangestion-db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artisangestion_db}
      POSTGRES_USER: ${POSTGRES_USER:-artisangestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Poulet5*}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: artisangestion-backend
    restart: unless-stopped
    expose:
      - 8000
    environment:
      - POSTGRES_SERVER=db
    env_file:
      - .env.production
    depends_on:
      - db
    networks:
      - app-network
    # Run migrations and then use standard uvicorn worker for production (no --reload)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

networks:
  app-network:
    external: true

volumes:
  pgdata:
