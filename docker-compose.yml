version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ventura-db-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ventura_dev_db}
      POSTGRES_USER: ${POSTGRES_USER:-ventura_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ventura_dev_pwd}
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: ventura-backend-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./backend:/app  # Hot-reloading en local
    networks:
      - app-network

networks:
  app-network:
    external: true

volumes:
  pgdata_dev:
