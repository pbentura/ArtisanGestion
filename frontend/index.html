<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ArtisanGestion — La solution tout-en-un pour les artisans et PME : gérez vos devis, factures et rapports d'intervention avec l'aide de l'IA." />
    
    <link rel="canonical" href="https://artisangestion.com/" />

    <!-- Open Graph / Facebook / LinkedIn.
         L'URL pointait sur un ancien domaine Firebase et l'image sur un
         fichier inexistant : tout lien partagé apparaissait sans aperçu. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ArtisanGestion" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://artisangestion.com/" />
    <meta property="og:title" content="ArtisanGestion | Gestion simplifiée pour artisans & PME" />
    <meta property="og:description" content="Gérez vos devis, factures et interventions en toute simplicité. Gagnez du temps avec notre assistant IA." />
    <meta property="og:image" content="https://artisangestion.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le tableau de bord ArtisanGestion : chiffre d'affaires, encours client et factures en retard." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArtisanGestion | Gestion simplifiée pour artisans & PME" />
    <meta name="twitter:description" content="Gérez vos devis, factures et interventions en toute simplicité. Gagnez du temps avec notre assistant IA." />
    <meta name="twitter:image" content="https://artisangestion.com/og-image.jpg" />

    <title>ArtisanGestion | Gestion simplifiée pour artisans & PME</title>
  </head>
  <body>
    <!-- Splash screen — visible instantly, hidden once Vue mounts -->
    <div id="splash" style="
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #F8FAFC;
      transition: opacity 0.3s ease;
    ">
      <img src="/logo.svg" alt="ArtisanGestion" width="64" height="64" style="margin-bottom: 16px;" />
      <div style="
        width: 32px; height: 32px;
        border: 3px solid #E2E8F0; border-top-color: #2563EB;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      "></div>
      <style>
        @keyframes splash-spin { to { transform: rotate(360deg); } }
        @media (prefers-color-scheme: dark) {
          #splash { background: #0F172A !important; }
          #splash div { border-color: #334155 !important; border-top-color: #3B82F6 !important; }
        }
        .dark #splash { background: #0F172A !important; }
        .dark #splash div { border-color: #334155 !important; border-top-color: #3B82F6 !important; }
      </style>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Hide splash as soon as #app has content
      const observer = new MutationObserver(() => {
        const app = document.getElementById('app');
        if (app && app.children.length > 0) {
          const splash = document.getElementById('splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(() => splash.remove(), 300);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('app'), { childList: true });
    </script>
  </body>
</html>
